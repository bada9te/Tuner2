name: 🚀 Deploy Discord Bot to EC2

on:
  push:
    branches:
      - main  # deploy when pushing to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build (optional)
        run: |
          if grep -q "\"build\"" package.json; then
            npm run build
          else
            echo "No build script found, skipping build."
          fi

      # 🧩 Write your private key into a file
      - name: Create SSH key file
        run: |
          echo "${{ secrets.AWS_EC2_SSH }}" > key.pem
          chmod 600 key.pem

      # 📦 Upload project files to EC2
      - name: Upload files to EC2 via rsync
        run: |
          rsync -avz -e "ssh -i key.pem -o StrictHostKeyChecking=no" \
          ./ ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}:/home/${{ secrets.AWS_EC2_USER }}/tuner2-bot

      # 🚀 Restart bot on EC2
      - name: Restart Discord bot
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << 'EOF'
            cd ~/tuner2-bot
            npm install
            pm2 restart tuner2-bot || pm2 start index.js --name tuner2-bot
            pm2 save
            EOF