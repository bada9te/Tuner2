name: 🚀 Deploy to EC2

on:
  push:
    branches:
      - main  # deploy only when pushing to main branch

jobs:
  deploy:
    name: Deploy App to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project (if applicable)
        run: |
          if [ -f package.json ] && grep -q "\"build\"" package.json; then
            npm run build
          else
            echo "No build step found, skipping..."
          fi

      - name: Upload code to EC2
        uses: appleboy/scp-action@v0.1.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH }}
          source: "."
          target: "${{ secrets.EC2_APP_DIR || '/home/ec2-user/app' }}"

      - name: Restart App on EC2
        uses: appleboy/ssh-action@v0.1.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH }}
          script: |
            cd "${{ secrets.EC2_APP_DIR || '/home/ec2-user/app' }}"
            echo "📦 Installing dependencies..."
            npm ci --omit=dev
            echo "🔁 Restarting PM2 process..."
            pm2 restart tuner2-bot || pm2 start index.js --name tuner2-bot
            pm2 save
            echo "✅ Deployment complete!"
